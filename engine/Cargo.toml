[package]
name = "npcspeech-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Real-time voice effects and virtual microphone for NPCSpeech"

[dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
libspa = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signalsmith-stretch = "0.1.3"

[profile.dev]
opt-level = 1

